[workspace]
resolver = "2"
members = [
    "core",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Alex <BlackEric001@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/BlackEric001/NtfsStreamsViewer"
description = "NTFS Alternate Data Streams viewer and editor"

[workspace.dependencies]
# Общие зависимости для всего workspace
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"